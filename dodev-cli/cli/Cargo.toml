[package]
name = "dodev-cli"
version = "0.1.5"
edition = "2021"
description = "do.dev CLI — local.dev tunnels (real .dev hostname, real HTTPS, OAuth-ready)"
repository = "https://github.com/dodotdev/dodev-public"
homepage = "https://local.dev"
license = "MIT OR Apache-2.0"

[[bin]]
name = "dodev"
path = "src/main.rs"

[dependencies]
# localdev-protocol was the wire format for the decommissioned Rust-on-Railway
# relay (see doc/local/ARCHITECTURE.md §Decommissioned). v1 uses JSON envelopes
# over Cloudflare Worker + Durable Object WebSocket; that protocol is inlined
# in tunnel.rs and the protocol crate is no longer a dependency.
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# gzip/brotli/deflate features enable auto-decompression. Without them
# the proxy returns raw compressed bytes to the Worker, which Cloudflare
# strips the content-encoding header from (Workers are expected to
# return uncompressed bodies — CF re-compresses at the edge). Net result
# was gzipped bytes labelled as plain text → garbage in the browser.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "6"
toml = "0.8"
colored = "2"
indicatif = "0.17"
url = "2"
thiserror = "2"
rustls = { version = "0.23", features = ["ring"] }
# Self-update support. Reads the install receipt that cargo-dist's installer
# writes (~/.config/dodev-cli/install-receipt.json) and pulls the latest
# release artifact from GitHub. Users installed via cargo install or built
# from source won't have a receipt — `dodev update` will print a friendly
# error pointing them at install.sh.
axoupdater = { version = "0.9", default-features = false, features = ["github_releases", "tokio"] }
# Used by src/active.rs for libc::kill(pid, 0) — the canonical "is this
# process alive?" probe. Lets us prune stale tunnel lockfiles from
# CLIs that crashed without cleanup.
libc = "0.2"
